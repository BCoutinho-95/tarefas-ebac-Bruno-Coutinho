server:
  port: 8082

spring:
  datasource:
    url: jdbc:h2:mem:produto;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

# Swagger UI at /swagger-ui/index.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
