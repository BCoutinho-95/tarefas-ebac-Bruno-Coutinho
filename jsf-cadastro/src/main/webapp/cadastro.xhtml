<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://jakarta.ee/web/faces/html">
<h:head>
    <title>Cadastro de Usuário</title>
</h:head>
<h:body>
    <h:form>
        <h:panelGrid columns="2">
            <h:outputLabel for="nome" value="Nome:"/>
            <h:inputText id="nome" value="#{usuarioBean.usuario.nome}" />

            <h:outputLabel for="email" value="Email:"/>
            <h:inputText id="email" value="#{usuarioBean.usuario.email}" />

            <h:outputLabel for="senha" value="Senha:"/>
            <h:inputSecret id="senha" value="#{usuarioBean.usuario.senha}" />

            <h:commandButton value="Cadastrar" action="#{usuarioBean.salvar}" />
        </h:panelGrid>
    </h:form>
</h:body>
</html>
